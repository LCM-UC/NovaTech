<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech Hardware</title>
    <!-- Fuentes y Bootstrap 5 -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-light">

    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top font-rajdhani">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 tracking-wide cursor-pointer" onclick="navegar('inicio')">NOVATECH_</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link cursor-pointer" onclick="navegar('inicio')">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link cursor-pointer" onclick="navegar('catalogo')">CATÁLOGO</a></li>
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-outline-light btn-sm fw-bold" onclick="navegar('carrito')">
                            CARRITO [<span id="cart-count">0</span>]
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alertas (Carga y Error) -->
    <div id="loader" class="alert alert-dark text-center rounded-0 border-secondary hidden m-0 font-rajdhani">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div> Conectando con el servidor base...
    </div>
    <div id="error-message" class="alert alert-danger text-center rounded-0 hidden m-0 font-rajdhani"></div>

    <main id="app-content" class="container py-5 font-rajdhani">
        
        <!-- SECCIÓN: INICIO -->
        <section id="sec-inicio" class="section active text-center py-5">
            <div class="p-5 mb-4 bg-dark rounded-0 border border-secondary hero-section">
                <div class="container-fluid py-5">
                    <h1 class="display-3 fw-bold tracking-wide">ACTUALIZA TU HARDWARE</h1>
                    <p class="col-md-8 mx-auto fs-4 text-muted">Componentes y periféricos de alto rendimiento para setups exigentes.</p>
                    <button class="btn btn-light btn-lg mt-4 fw-bold rounded-0" onclick="navegar('catalogo')">VER CATÁLOGO COMPLETO</button>
                </div>
            </div>
            
            <!-- Contenedor para los carruseles dinámicos -->
            <div id="carruseles-inicio" class="container mt-5"></div>
        </section>

        <!-- SECCIÓN: CATÁLOGO Y FILTROS -->
        <section id="sec-catalogo" class="section hidden">
            <h2 class="mb-4 fw-bold border-bottom border-secondary pb-2">_CATÁLOGO DE PRODUCTOS</h2>
            
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <input type="text" id="input-busqueda" class="form-control form-control-lg bg-dark text-light border-secondary rounded-0" placeholder="Buscar por nombre o modelo...">
                </div>
                <div class="col-md-4">
                    <select id="select-categoria" class="form-select form-select-lg bg-dark text-light border-secondary rounded-0">
                        <option value="todas">Todas las categorías</option>
                    </select>
                </div>
            </div>

            <!-- Grilla de productos Bootstrap -->
            <div id="grid-productos" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>
            
            <div id="empty-message" class="alert alert-dark text-center mt-4 hidden rounded-0 border-secondary">
                No se encontraron componentes con esos parámetros.
            </div>
        </section>

        <!-- SECCIÓN: DETALLE -->
        <section id="sec-detalle" class="section hidden">
            <button class="btn btn-outline-secondary mb-4 rounded-0" onclick="navegar('catalogo')">&lt; VOLVER AL CATÁLOGO</button>
            <div id="contenedor-detalle" class="bg-dark border border-secondary p-4 p-md-5">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

        <!-- SECCIÓN: CARRITO -->
        <section id="sec-carrito" class="section hidden">
            <h2 class="mb-4 fw-bold border-bottom border-secondary pb-2">_TU CARRITO</h2>
            <div class="bg-dark border border-secondary p-4">
                <div id="lista-carrito" class="mb-4"></div>
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center border-top border-secondary pt-4 mt-4">
                    <h3 class="mb-3 mb-md-0">TOTAL: $<span id="total-precio">0.00</span></h3>
                    <button class="btn btn-light btn-lg fw-bold rounded-0" onclick="procesarCompra()">PROCESAR ORDEN</button>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
